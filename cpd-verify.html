<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Verify CPD Certificate — AMLPN</title>
<script src="/nav.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6f9;
    color: #243447;
    font-size: 15px;
    line-height: 1.6;
  }
  .hero {
    background: linear-gradient(135deg, #17365D 0%, #2B5A94 100%);
    color: #fff;
    padding: 24px 22px 22px;
    border-radius: 12px;
    margin: 16px auto 14px;
    box-shadow: 0 4px 14px rgba(23,54,93,.18);
    text-align: center;
    max-width: 720px;
    width: calc(100% - 32px);
  }
  .hero h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  .hero .sub {
    color: #E5C453;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .hero p {
    margin: 10px auto 0;
    font-size: 13px;
    line-height: 1.6;
    opacity: .92;
    max-width: 620px;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }
  .card {
    background: #fff;
    border: 1px solid #d9e2ec;
    border-radius: 12px;
    padding: 24px 22px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .input-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .input-row input {
    flex: 1;
    min-width: 200px;
    padding: 12px 14px;
    border: 1px solid #d9e2ec;
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
  }
  .input-row input:focus {
    outline: none;
    border-color: #17365D;
    box-shadow: 0 0 0 3px rgba(23,54,93,.1);
  }
  .input-row button {
    padding: 12px 22px;
    background: #17365D;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .input-row button:hover { background: #0F2A47; }
  .input-row button:disabled { background: #94A3B8; cursor: not-allowed; }
  .state {
    text-align: center;
    padding: 50px 20px;
    color: #657786;
    font-size: 14px;
  }
  .state .icon { font-size: 48px; margin-bottom: 12px; }
  .state h3 { color: #17365D; margin: 0 0 8px; font-size: 20px; }
  .state.error h3 { color: #B71C1C; }
  .verify-card {
    background: #fff;
    border: 1px solid #d9e2ec;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    margin-bottom: 14px;
  }
  .verify-card .top {
    background: linear-gradient(135deg, #17365D 0%, #2B5A94 100%);
    color: #fff;
    padding: 22px 24px;
    text-align: center;
  }
  .verify-card .top .icon {
    font-size: 42px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .verify-card .top h2 {
    margin: 0;
    font-size: 20px;
    letter-spacing: .5px;
  }
  .verify-card .top .sub {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #E5C453;
    margin-top: 6px;
  }
  .verify-card .body { padding: 24px; }
  .info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .info-table td {
    padding: 12px 10px;
    border-bottom: 1px solid #eef2f6;
    vertical-align: top;
  }
  .info-table td:first-child {
    color: #657786;
    width: 42%;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .info-table td:last-child {
    color: #17365D;
    font-weight: bold;
    text-align: right;
    word-break: break-word;
  }
  .info-table tr:last-child td { border-bottom: none; }
  .cert-id-box {
    margin-top: 18px;
    padding: 14px;
    background: #F4F6F8;
    border: 1px solid #d9e2ec;
    border-radius: 8px;
    text-align: center;
  }
  .cert-id-box .label {
    font-size: 11px;
    color: #657786;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .cert-id-box .id {
    font-family: Consolas, Monaco, monospace;
    font-size: 15px;
    font-weight: bold;
    color: #17365D;
    letter-spacing: 1px;
    word-break: break-all;
  }
  .points-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #E7F4EA;
    color: #26733C;
  }
  .footer {
    text-align: center;
    padding: 30px 16px 20px;
    color: #657786;
    font-size: 11px;
    line-height: 1.7;
  }
  .footer strong { color: #17365D; }
  .hidden { display: none !important; }
</style>
</head>
<body data-page="CPD Certificate Verification">

<div class="hero">
  <h1>Verify CPD Certificate</h1>
  <div class="sub">AMLPN CPD Centre</div>
  <p>Confirm the authenticity of an AMLPN Continuous Professional Development certificate.</p>
</div>

<div class="page">

  <div class="card">
    <label style="font-size:12px;font-weight:bold;color:#17365D;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px;">Certificate ID</label>
    <div class="input-row">
      <input type="text" id="certInput" placeholder="e.g. AMLPN/CPD/2026/0001" autocomplete="off">
      <button id="btnVerify">Verify</button>
    </div>
  </div>

  <div class="state hidden" id="loadingState">Checking…</div>

  <div class="state error hidden" id="errorState">
    <div class="icon">⚠️</div>
    <h3 id="errorTitle">Certificate Not Found</h3>
    <p id="errorMsg">The certificate ID you entered could not be verified.</p>
  </div>

  <div id="resultWrap" class="hidden"></div>

</div>

<div class="footer">
  <strong>Atria Medical Laboratory Professionals Network</strong><br>
  Together We Can
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzANP2bSpfw1fOXQR6HIXP0LE06m4Wq89Wisl5YvBA0f2FIyAtKc0nU0jp4JiPy432B/exec";

async function api(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return res.json();
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

const params = new URLSearchParams(window.location.search);
const preseed = params.get("cert");
if (preseed) {
  document.getElementById("certInput").value = preseed;
  verify(preseed);
}

document.getElementById("btnVerify").addEventListener("click", () => {
  const v = document.getElementById("certInput").value.trim();
  if (!v) return;
  verify(v);
});

document.getElementById("certInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("btnVerify").click();
});

async function verify(certId) {
  document.getElementById("resultWrap").classList.add("hidden");
  document.getElementById("errorState").classList.add("hidden");
  document.getElementById("loadingState").classList.remove("hidden");
  document.getElementById("btnVerify").disabled = true;

  try {
    const res = await api({ action: "cpd-verify", certificateId: certId });
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("btnVerify").disabled = false;

    if (!res || !res.ok) {
      document.getElementById("errorTitle").textContent = "Certificate Not Found";
      document.getElementById("errorMsg").textContent = (res && res.message) || "The certificate ID could not be verified.";
      document.getElementById("errorState").classList.remove("hidden");
      return;
    }

    renderResult(res.certificate);
  } catch (err) {
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("btnVerify").disabled = false;
    document.getElementById("errorTitle").textContent = "Network Error";
    document.getElementById("errorMsg").textContent = "Please try again.";
    document.getElementById("errorState").classList.remove("hidden");
  }
}

function renderResult(c) {
  const isAccredited = String(c.accreditation || "").toLowerCase() === "accredited";
  const pointsLabel = isAccredited
    ? c.accreditedPoints + " CPD Points (Accredited)"
    : c.legacyPoints + " Legacy Points";

  const box = document.getElementById("resultWrap");
  box.innerHTML =
    '<div class="verify-card">' +
      '<div class="top">' +
        '<div class="icon">✓</div>' +
        '<h2>Certificate Verified</h2>' +
        '<div class="sub">Authentic AMLPN Record</div>' +
      '</div>' +
      '<div class="body">' +
        '<table class="info-table">' +
          '<tr><td>Awarded To</td><td>' + escapeHtml(c.memberName) + '</td></tr>' +
          '<tr><td>Member ID</td><td>' + escapeHtml(c.memberId) + '</td></tr>' +
          '<tr><td>Session</td><td>' + escapeHtml(c.sessionTitle) + '</td></tr>' +
          '<tr><td>Category</td><td>' + escapeHtml(c.sessionCategory || "—") + '</td></tr>' +
          '<tr><td>Provider</td><td>' + escapeHtml(c.provider || "AMLPN") + '</td></tr>' +
          '<tr><td>Completed On</td><td>' + escapeHtml(c.completedOn || "—") + '</td></tr>' +
          '<tr><td>Score</td><td>' + c.score + '%</td></tr>' +
          '<tr><td>Award</td><td><span class="points-badge">' + escapeHtml(pointsLabel) + '</span></td></tr>' +
        '</table>' +
        '<div class="cert-id-box">' +
          '<div class="label">Certificate ID</div>' +
          '<div class="id">' + escapeHtml(c.certificateId) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  box.classList.remove("hidden");
}

</script>
</body>
</html>
