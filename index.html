<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMLPN Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #243447;
    }
    .header {
      background: #17365D;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 3px;
    }
    .header .sub {
      font-size: 12px;
      margin-top: 8px;
      opacity: .9;
    }
    .flag {
      display: flex;
      width: 180px;
      height: 5px;
      margin: 16px auto 0;
    }
    .flag div { flex: 1; }
    .flag .b { background: #000; }
    .flag .y { background: #FCDC04; }
    .flag .r { background: #D90000; }
    .main {
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      text-align: center;
    }
    .main h2 {
      color: #17365D;
      margin-top: 0;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #17365D;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .footer {
      text-align: center;
      margin-top: 60px;
      padding: 20px;
      color: #657786;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AMLPN</h1>
    <div class="sub">ATRIA MEDICAL LABORATORY PROFESSIONALS NETWORK</div>
    <div class="flag">
      <div class="b"></div><div class="y"></div><div class="r"></div>
    </div>
  </div>

  <div class="main">
    <h2>Portal Coming Soon</h2>
    <p>The AMLPN Member Portal is being set up.</p>
    <p>Check back shortly.</p>
    <p><strong>Together We Can</strong></p>
  </div>

  <div class="footer">
    <strong>Atria Medical Laboratory Professionals Network</strong><br>
    Together We Can
  </div>
</body>
</html>
